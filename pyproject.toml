[project]
name = "revelio-ai"
version = "0.1.0"
description = "Assistente visual para pessoas cegas — protótipo de pós-graduação em IA Generativa e LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pillow>=11.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# FastAPI's dependency-injection idiom relies on calling Depends()/File() in
# argument defaults; that's the framework's intended usage, not the mutable-
# default-argument bug B008 normally guards against.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# YOLO inference runs on the CPU (the nano model is small enough for it); the
# project's only GPU is the separate Ollama host, reached over HTTP/VPN. Pull
# CPU-only torch wheels to avoid installing multi-gigabyte CUDA packages here.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
